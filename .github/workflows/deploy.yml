# Builds the Astro site and deploys it to GitHub Pages.
#
# Only takes effect when the repo settings under Pages use
# "Source: GitHub Actions".
#
# The weekly cron trigger moves finished retreats to "Bisherige Retreats"
# automatically, even without a new commit.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # Jeden Montag um 04:30 UTC neu bauen (Datum-basierte Archivierung)
    - cron: "30 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run check

  build:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: withastro/action@v3
        with:
          # The action defaults to Node 20, Astro 7 needs >= 22.12.
          # Keep in sync with .node-version.
          node-version: 24

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
